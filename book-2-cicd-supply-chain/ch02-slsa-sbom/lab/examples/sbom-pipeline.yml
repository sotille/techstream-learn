# GitHub Actions — SBOM Generation and Attestation Pipeline
# This is a simplified learning example. Not intended for direct production use.
# See secure-pipeline-templates/ for production-ready implementations.

name: Build with SBOM Attestation (Learning Example)

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # Required for OIDC token (Cosign keyless signing)
  packages: write   # Required to push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ steps.build.outputs.image-ref }}

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # Pin to commit SHA

      - name: Log in to container registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbea46c2e49f16b0b2a37a4a7e7a
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@14487ce63c7a0ac84e7fd4a5a4ed1ef35adaff34
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # SBOM is generated AFTER build completes, referencing the exact pushed digest.
      # Generating from the digest (not tag) ensures the SBOM matches what was pushed.
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate CycloneDX SBOM
        id: sbom
        run: |
          syft \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" \
            -o cyclonedx-json=sbom.cdx.json
          echo "SBOM component count: $(cat sbom.cdx.json | jq '.components | length')"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Cosign keyless signing uses OIDC identity from the GitHub Actions token.
      # No signing key is stored anywhere — the key is ephemeral per-signing-event.
      - name: Attach SBOM attestation with Cosign (keyless)
        run: |
          cosign attest \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      - name: Upload SBOM as pipeline artifact (for audit retention)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  # Verify the attestation immediately after attestation creation.
  # In production, this verification runs at deployment time (admission control).
  verify-attestation:
    needs: build-and-attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify SBOM attestation exists and is valid
        run: |
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-attest.outputs.image-digest }}"
