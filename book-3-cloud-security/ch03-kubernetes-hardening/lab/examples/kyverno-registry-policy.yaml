# Kyverno ClusterPolicy: Restrict container images to approved registries.
# Approved registries: gcr.io/distroless and registry.internal.example.com
# All other image sources are blocked.
# validationFailureAction: Enforce — violations cause the admission request to be rejected.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Images must be pulled from approved registries only.
      Unapproved registries may serve images that have not been
      scanned, signed, or approved by the security team.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Images must be from approved registries: gcr.io/distroless or registry.internal.example.com"
        pattern:
          spec:
            containers:
              - image: "gcr.io/distroless/* | registry.internal.example.com/*"
            =(initContainers):
              - image: "gcr.io/distroless/* | registry.internal.example.com/*"
