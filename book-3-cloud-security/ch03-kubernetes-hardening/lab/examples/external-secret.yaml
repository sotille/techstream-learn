# External Secrets Operator — ExternalSecret resource
# Fetches database credentials from AWS Secrets Manager and creates a Kubernetes Secret.
# Requires:
#   - External Secrets Operator installed (helm install external-secrets external-secrets/external-secrets)
#   - A ClusterSecretStore named 'aws-secrets-manager' configured with IRSA
#   - A secret at path 'payments/prod/db-credentials' in AWS Secrets Manager
#
# The resulting Kubernetes Secret 'db-credentials' in the 'payments' namespace
# is populated and refreshed every hour automatically.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: payments
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
        username: "{{ .username }}"
  data:
    - secretKey: password
      remoteRef:
        key: payments/prod/db-credentials
        property: password
    - secretKey: username
      remoteRef:
        key: payments/prod/db-credentials
        property: username
